# Additive config: keep the upstream rule set, allowlist only fake values.
[extend]
useDefault = true

# Narrow global allowlist. Everything listed here is a placeholder that is
# committed on purpose: local dev defaults, test fixtures and CI-only values.
# (Array-of-tables form: gitleaks 8.x refuses to load a config that mixes the
# deprecated singular [allowlist] with [[allowlists]]. Entries are unchanged.)
[[allowlists]]
description = 'Fake placeholder credentials committed on purpose (dev template, tests, CI)'

# The documented dev template; every value in it is a placeholder by design.
paths = ['''(?:^|/)\.env\.example$''']

# Matched as a substring of the reported secret, so it covers .env.example,
# test fixtures and workflow files without allowlisting whole directories.
stopwords = [
  "dev-only-change-me",
  "test-only",
  "db-test-",
  "unit-test-",
  "ci-only-",
]

# Fake TOTP / document master keys and fake document object keys in five test
# files only. The values are base64url blobs and UUIDs, so the plain-text
# stopwords above cannot catch them. Requiring path AND assignment name means a
# real key in any other file, or a real key of another name in these files, is
# still reported.
[[allowlists]]
description = 'Fake test-only TOTP and document keys: base64/UUID form escapes the plain-text stopwords'
condition = "AND"
paths = [
  '''^src/config/env\.spec\.ts$''',
  '''^src/rate-limit/throttler\.config\.spec\.ts$''',
  '''^test/helpers/test-env\.ts$''',
  '''^src/documents/env-key-wrapper\.spec\.ts$''',
  '''^src/documents/document-crypto\.service\.spec\.ts$''',
]
regexTarget = "match"
regexes = [
  # TOTP and document master keys (the document specs name the fixed, fake
  # 32-byte fixtures MASTER_KEY / OTHER_MASTER_KEY, hence the extra alternatives).
  '''(?i)\b(?:PROD_)?(?:TOTP_ENC_KEY|(?:OTHER_)?MASTER_KEY|DOCUMENT_MASTER_KEY|DOCUMENT_MASTER_KEY_PREVIOUS)\b["'`]?\s*(?:=>|=|:)\s*["'`]?[A-Za-z0-9_\-+/=]{8,}''',
  # Document object ids: fixed, fake UUIDs in the two document specs only.
  '''(?i)\b(?:OTHER_)?OBJECT_KEY\b["'`]?\s*(?:=>|=|:)\s*["'`]?[0-9a-f-]{36}''',
]
