# pnpm 12 configuration for this single-package repository.
#
# Build scripts stay disabled (see .npmrc `ignore-scripts=true`). Every package
# that ships a lifecycle script is declared here with an explicit decision so
# `pnpm install` stays deterministic and non-interactive.
#
# `@parcel/watcher` and `unrs-resolver` ship optional native accelerators; the
# JavaScript fallbacks are used instead. The Prisma packages are deliberately
# NOT allowed to run their install scripts either: Prisma Client is generated
# explicitly with `pnpm prisma generate` (never during `pnpm install`), so no
# dependency can execute code as a side effect of installing.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
  prisma: false
  '@prisma/client': false
  '@prisma/engines': false

# Overrides applied to every dependency graph in this repository.
overrides:
  # GHSA-ggr8-5vv4-36mx (high): deepmerge-ts < 8.0.0. Pulled in only by the
  # build-time Prisma CLI chain (prisma > @prisma/config, which pins 7.1.5).
  deepmerge-ts: 8.0.2

# Packages allowed to bypass the release-age cooldown: the NestJS 12 line is
# pinned intentionally (see package.json).
minimumReleaseAgeExclude:
  - '@nestjs/common@12.3.2'
  - '@nestjs/core@12.3.2'
  - '@nestjs/platform-express@12.3.2'
  - '@nestjs/testing@12.3.2'
