# Local development dependencies ONLY (Postgres + Redis). Not for staging or production.
# Credentials are dev placeholders and can be overridden from the shell.
# Every published port is bound to loopback so nothing is reachable from the LAN.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kfa-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-kfa_dev_superuser}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-kfa}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - kfa-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared rate-limit store. Ephemeral by design: persistence is disabled because
  # losing counters only means a slightly more permissive window, never data loss.
  # Bound to loopback, same as postgres; never reachable from the LAN.
  redis:
    image: redis:7-alpine
    container_name: kfa-redis-dev
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-dev-only-change-me}
      - --save
      - ''
      - --appendonly
      - 'no'
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '--no-auth-warning',
          '-a',
          '${REDIS_PASSWORD:-dev-only-change-me}',
          'ping',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kfa-postgres-dev-data:
