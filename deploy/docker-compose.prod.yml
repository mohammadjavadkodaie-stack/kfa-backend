name: kfa

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      WWW_REDIRECT_DOMAIN: ${WWW_REDIRECT_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      frontend: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.50
    logging: &default-logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:2019/config/]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../../KFA-frontend}
    restart: unless-stopped
    expose: [3000]
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:?set BACKEND_INTERNAL_URL}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:?set CAPTCHA_PROVIDER}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?set TURNSTILE_SITE_KEY}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:?set FRONTEND_PUBLIC_URL}
    networks: [edge, internal]
    depends_on:
      backend: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.00
    logging: *default-logging
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:3000/]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build: { context: .. }
    restart: unless-stopped
    expose: [3001]
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGINS: ${APP_ORIGINS:?set APP_ORIGINS}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:?set TRUSTED_PROXY_COUNT}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-102400}
      OTP_PROVIDER: ${OTP_PROVIDER:?set OTP_PROVIDER}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:?set CAPTCHA_PROVIDER}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:?set TURNSTILE_EXPECTED_HOSTNAME}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?set EMAIL_PROVIDER}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?set AUDIT_HMAC_KEY}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:?set RATE_LIMIT_HMAC_KEY}
      OTP_PROOF_SECRET: ${OTP_PROOF_SECRET:?set OTP_PROOF_SECRET}
      EMAIL_CODE_HMAC_KEY: ${EMAIL_CODE_HMAC_KEY:?set EMAIL_CODE_HMAC_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.00
    logging: *default-logging
    healthcheck:
      test: [CMD, wget, -q, -O, -, http://127.0.0.1:3001/health]
      interval: 30s
      timeout: 5s
      retries: 5

  migrate:
    profiles: [tools]
    build: { context: .. }
    command: [pnpm, exec, prisma, migrate, deploy]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL}
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.00
    logging: *default-logging

      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?set TOTP_ENC_KEY}
      DOCUMENT_MASTER_KEY: ${DOCUMENT_MASTER_KEY:?set DOCUMENT_MASTER_KEY}
      DOCUMENT_MASTER_KEY_ID: ${DOCUMENT_MASTER_KEY_ID:-v1}
      DOCUMENT_VIEW_TOKEN_SECRET: ${DOCUMENT_VIEW_TOKEN_SECRET:?set DOCUMENT_VIEW_TOKEN_SECRET}
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kfa}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.00
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --requirepass, ${REDIS_PASSWORD:?set REDIS_PASSWORD}, --save, "", --appendonly, "no"]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment: { REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD} }
    mem_limit: 256m
    cpus: 0.50
    logging: *default-logging
    # Ephemeral is intentional: rate-limit counters may reset; no durable data is stored.

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "clamdcheck || nc -z 127.0.0.1 3310"]
      interval: 30s
      timeout: 10s
      retries: 20
    mem_limit: 2g
    cpus: 2.00
    logging: *default-logging
    # Signature updates and clamd are memory-heavy; reserve at least 2 GiB.

networks:
  edge: {}
  internal:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:

